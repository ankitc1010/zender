# CI as in TRD §14: one Linux runner checks formatting, cross-compiles
# every target (CLI and tests) and runs the wasm32-wasi tests; each Tier 1
# platform then runs the tests natively and smoke-tests the binary. The
# other Tier 2 target, x86-64 macOS, runs its tests on the Apple Silicon
# runner under Rosetta 2. The golden suites run inside zig build test; a
# separate job measures line coverage with kcov.
#
# mlugg/setup-zig@v2 still declares Node 20; GitHub runs it on Node 24.
name: ci
on:
  push:
  pull_request:

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig src tests
      - name: Cross-compile CLI and tests
        run: |
          for t in x86_64-linux-musl aarch64-linux-musl aarch64-macos x86_64-macos x86_64-windows-gnu wasm32-wasi; do
            echo "::group::$t"
            zig build install test-compile -Dtarget=$t --prefix out/$t
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: zender-${{ github.sha }}
          path: out/*/bin/zender*
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Engine, render and I/O only; scripts/run-wasi.mjs runs them on Node's WASI.
      - name: wasm32-wasi tests (Tier 2)
        run: zig build test -Dtarget=wasm32-wasi --summary all

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test --summary all
      - name: x86-64 macOS tests under Rosetta 2 (Tier 2)
        if: matrix.os == 'macos-latest'
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          zig build test -Dtarget=x86_64-macos -frosetta --summary all
      - run: zig build
      - name: Replay the example command log
        run: |
          ./zig-out/bin/zender run examples/dining.jsonl -o dining.glb
          ./zig-out/bin/zender run examples/dining.jsonl -o dining.gltf
          ./zig-out/bin/zender run examples/dining.jsonl -o dining.png --width 320
          test "$(head -c 4 dining.glb)" = "glTF"
      - name: MCP handshake over stdio
        run: |
          meta='"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}'
          printf '%s\n' "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"server/discover\",\"params\":{$meta}}" \
            "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\",\"params\":{$meta}}" \
            | ./zig-out/bin/zender serve --stdio > out.jsonl
          grep -q '"supportedVersions":\["2026-07-28"' out.jsonl
          grep -q '"name":"render.preview"' out.jsonl
      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22
      - name: MCP Inspector session, both protocol eras
        if: matrix.os == 'ubuntu-latest'
        run: scripts/inspector-session.sh
      - name: Memory targets (NFR-5)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/measure-memory.mjs --check
      - name: G1 task set self-check (reference solutions pass, an empty scene fails)
        if: matrix.os == 'ubuntu-latest'
        run: node eval/agent/selfcheck.mjs
      - name: Khronos glTF validator
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/validator" gltf-validator@2.0.0-dev.3.10
          node scripts/validate-gltf.mjs "$RUNNER_TEMP/validator/node_modules" dining.glb dining.gltf

  # TRD §15: line coverage of src/core, src/geom and src/io, reported per
  # directory in the job summary; the job fails below 85% in any of them.
  # ubuntu-26.04 because Ubuntu 24.04 does not package kcov.
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y kcov
      - run: node scripts/coverage.mjs --min 85
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/merged
